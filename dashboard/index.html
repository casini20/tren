<script>(function(){if(navigator.maxTouchPoints>0||"ontouchstart" in window){var v=document.querySelector("meta[name=viewport]");if(v){v.setAttribute("content","width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no");}else{var m=document.createElement("meta");m.name="viewport";m.content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no";if(document.head)document.head.insertBefore(m,document.head.firstChild);}}})();</script>
